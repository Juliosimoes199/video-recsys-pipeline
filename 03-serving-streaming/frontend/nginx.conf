server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Encaminha tudo em /api pro video-service (Python), dentro da rede do
    # docker-compose. Isso evita CORS em produção e mantém o frontend e a
    # API sob a mesma origem para o navegador.
    location /api/ {
        proxy_pass http://video-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
